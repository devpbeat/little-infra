server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS (127.0.0.11) + a variable in proxy_pass defers
    # "payments" hostname resolution to request time instead of config
    # load time. Without this, nginx refuses to start (or crash-loops) if
    # the payments-ui container comes up before the payments container —
    # compose does not guarantee start order here.
    resolver 127.0.0.11 valid=30s;

    # Same-origin proxy to the payments Django backend — mirrors the
    # dev-time proxy in vite.config.ts so the dashboard talks to the API,
    # Django admin, and static files without CORS or backend changes.
    location /api/ {
        set $payments_upstream http://payments:8000;
        proxy_pass $payments_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        set $payments_upstream http://payments:8000;
        proxy_pass $payments_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        set $payments_upstream http://payments:8000;
        proxy_pass $payments_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: any route not matched above falls through to
    # index.html so client-side routing (react-router-dom) works on
    # hard refresh / deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
