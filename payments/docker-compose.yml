services:
  postgres:
    image: postgres:16
    container_name: payments-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payments}
      POSTGRES_USER: ${POSTGRES_USER:-payments}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - payments_pgdata:/var/lib/postgresql/data
    # Internal-only: no ports published, not on the platform network, so
    # only this stack's services can reach it.
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-payments} -d ${POSTGRES_DB:-payments}"]
      interval: 10s
      timeout: 5s
      retries: 5

  payments:
    image: ghcr.io/devpbeat/payments:${PAYMENTS_TAG:-latest}
    container_name: payments
    restart: unless-stopped
    env_file: .env
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - platform
      - internal
    labels:
      - traefik.enable=true
      - traefik.http.routers.payments.rule=Host(`payments.ignitesolutions.click`)
      - traefik.http.routers.payments.entrypoints=websecure
      - traefik.http.routers.payments.tls=true
      - traefik.http.routers.payments.tls.certresolver=myresolver
      - traefik.http.routers.payments.middlewares=secure-headers@file
      - traefik.http.services.payments.loadbalancer.server.port=8000
      - homepage.group=Services
      - homepage.name=Payments
      - homepage.href=https://payments.ignitesolutions.click
      - homepage.description=B2B subscription billing microservice

  payments-ui:
    image: ghcr.io/devpbeat/payments-ui:${PAYMENTS_UI_TAG:-latest}
    container_name: payments-ui
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - platform
      - internal
    labels:
      - traefik.enable=true
      - traefik.http.routers.payments-ui.rule=Host(`pay.ignitesolutions.click`)
      - traefik.http.routers.payments-ui.entrypoints=websecure
      - traefik.http.routers.payments-ui.tls=true
      - traefik.http.routers.payments-ui.tls.certresolver=myresolver
      - traefik.http.routers.payments-ui.middlewares=secure-headers@file
      - traefik.http.services.payments-ui.loadbalancer.server.port=80
      - homepage.group=Services
      - homepage.name=Payments UI
      - homepage.href=https://pay.ignitesolutions.click
      - homepage.description=Billing dashboard for the payments microservice

networks:
  # `platform` is the shared external network used by Traefik to route to
  # this stack's services. It is created by platform/docker-compose.yml —
  # `platform` must be deployed first, and PLATFORM_NETWORK must resolve to
  # the same value used there (see payments/DEPLOY.md).
  platform:
    external: true
    name: ${PLATFORM_NETWORK}
  # `internal` is private to this stack: app <-> UI proxy <-> database.
  # The database is reachable only here (decision: dedicated Postgres per
  # service for now; may consolidate to a single instance later).
  internal:

volumes:
  payments_pgdata:
