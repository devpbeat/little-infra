# Deploys the payments stack (API + UI + dedicated Postgres) on the VPS.
#
# Triggered via the Woodpecker API by GitHub Actions AFTER the GHCR image
# push succeeds (see the trigger-deploy jobs in payments-ci.yml and
# payments-ui-ci.yml) — this removes the deploy/build race where a push
# event deployed the PREVIOUS `latest` image while the new one was still
# building. Manual runs from the Woodpecker UI work too: set the pipeline
# variable DEPLOY_TARGET=payments when triggering.
#
# NOTE: adjust the bind-mount path below if the server checkout of this
# repo does not live at /home/ubuntu/little-infra (see README.md).
when:
  - event: manual
    evaluate: 'DEPLOY_TARGET == "payments"'

steps:
  - name: deploy
    image: docker:cli
    volumes:
      # Docker socket: lets this step drive the host's dockerd (same
      # pattern the woodpecker-agent itself uses, see ci/docker-compose.yml).
      - /var/run/docker.sock:/var/run/docker.sock
      # Bind-mount the server's actual checkout at the SAME path inside the
      # step container. This is required, not cosmetic: docker compose
      # commands issued here go over the socket to the host's dockerd, so
      # any relative paths it resolves (env_file: .env, named volumes,
      # build context) must exist at that exact path on the HOST — a fresh
      # Woodpecker workspace clone would not have payments/.env (gitignored,
      # server-managed secrets) or match the host path docker uses.
      - /home/ubuntu/little-infra:/home/ubuntu/little-infra
    commands:
      - cd /home/ubuntu/little-infra/payments
      - |
        echo "Pulling images (retrying — GHCR image may still be building in GitHub Actions)"
        attempt=1
        max_attempts=10
        until docker compose pull; do
          if [ "$attempt" -ge "$max_attempts" ]; then
            echo "docker compose pull failed after ${max_attempts} attempts — giving up"
            exit 1
          fi
          echo "pull failed (attempt ${attempt}/${max_attempts}), retrying in 15s..."
          attempt=$((attempt + 1))
          sleep 15
        done
      # Migrations run as an explicit one-off step before the app serves
      # traffic — never in the container entrypoint (see payments/DEPLOY.md
      # §4 and design §8: avoids migration races on scale-up, keeps
      # rollbacks unambiguous).
      - docker compose run --rm payments python manage.py migrate
      - docker compose up -d --remove-orphans
