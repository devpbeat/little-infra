name: portal-ui-ci

on:
  push:
    branches: [main]
    paths:
      - "portal-ui/**"
      - ".github/workflows/portal-ui-ci.yml"
  pull_request:
    paths:
      - "portal-ui/**"
      - ".github/workflows/portal-ui-ci.yml"

concurrency:
  group: portal-ui-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: portal-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build
        run: npm run build

  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: portal-ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: portal-ui
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/portal-ui:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/portal-ui:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Fires AFTER the image is in GHCR — see payments-ci.yml for rationale.
  trigger-deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Woodpecker deploy
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.WOODPECKER_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"branch":"main","variables":{"DEPLOY_TARGET":"portal"}}' \
            "https://ci.ignitesolutions.click/api/repos/${{ secrets.WOODPECKER_REPO_ID }}/pipelines"
