name: payments-ci

on:
  push:
    branches: [main]
    paths:
      - "payments/**"
      - ".github/workflows/payments-ci.yml"
  pull_request:
    paths:
      - "payments/**"
      - ".github/workflows/payments-ci.yml"

concurrency:
  group: payments-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payments
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: payments
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: payments
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payments -d payments"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_HOST: localhost
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --disable-pip-version-check ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest --allow-hosts=127.0.0.1,localhost

  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: payments
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: payments
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/payments:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/payments:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Woodpecker deploy
        if: ${{ vars.WOODPECKER_DEPLOY_URL != '' }}
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.WOODPECKER_DEPLOY_TOKEN }}" \
            "${{ vars.WOODPECKER_DEPLOY_URL }}"
