name: contracts

# Builds the contracts image to validate it. Deployment itself is handled
# natively by Woodpecker (see .woodpecker/contracts.yml), which is
# activated on this same GitHub repo and reacts directly to the push event
# — no deploy-trigger step needed here, and no WOODPECKER_TOKEN /
# WOODPECKER_REPO secrets required in this workflow.
on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - ".github/workflows/contracts.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image (validation)
        run: docker build -t little-infra-contracts:ci ./contracts
