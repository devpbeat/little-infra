server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any route not matched above falls through to
    # index.html so client-side routing (react-router-dom) works on
    # hard refresh / deep links. This slice has no backend API to proxy
    # to yet — portal-ui is fully static (Landing + Login), unlike
    # payments-ui which proxies /api, /admin, /static to the payments
    # service. A reverse proxy block will be added once portal-ui talks
    # to a real backend (product/plan API, auth) in a later slice.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
